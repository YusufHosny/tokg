      type: Policy
      name: Hiring a non-EU citizen in Belgium (single permit)
    attribute: summary
    value: 'Single permit applications are submitted exclusively through the online "Working in Belgium"
      platform; the regional department no longer accepts files sent by email. Hiring managers do not
      send applications themselves: they collect the candidate''s documents in the shared HR folder and
      Sophie Claes, Foo''s registered company user, submits every application. Salary thresholds for
      highly qualified workers are updated every January, so hiring managers must check the salary with
      Sophie before making an offer. Recent applications have been processed in about 2.5 to 3 months.'
    context:
      country: BE
      audience: non-EU nationals
    valid_from: '2025-03-11'
