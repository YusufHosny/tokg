extractions:
  meeting-2023-01-17-001:
  - kind: attribute
    subject:
      type: Policy
      name: Sick leave and doctors' notes
    attribute: summary
    value: 'Foo does not opt out of the statutory first-day exemption for sick leave certificates:
      employees may report sick for a single day without a doctor''s note, a maximum of 3 times per calendar
      year. The rule is laid down in Article 7.3 of the Work Regulations (amendment no. 3).'
    context:
      country: BE
    valid_from: '2023-01-17'
    quote: 'Decision: Foo will NOT opt out. The first-day exemption will be adopted (maximum 3 times
      per calendar year).'
  email-2022-11-30-001:
  - kind: attribute
    subject:
      type: Policy
      name: Sick leave and doctor's notes
    attribute: summary
    value: Since 28 November 2022, employees in Belgium no longer need to submit a medical certificate
      for the first day of incapacity for work, up to 3 times per calendar year (one-day absences). Employers
      with fewer than 50 employees, such as Foo (46 employees), may keep requiring a certificate for
      every absence, but only if the work regulations explicitly state this. Foo's Article 7.3 currently
      requires a certificate for every absence, so Foo must either adopt the exemption and update
      Article 7.3, or opt out via a formal amendment confirming the certificate requirement.
    context:
      country: BE
    valid_from: '2022-11-28'
    quote: Since 28 November 2022, employees no longer need to submit a medical certificate for the first
      day of incapacity for work, up to 3 times per calendar year.
    asserted_by: marc.dubois@sdworx.com
  wiki-2019-01-15-001:
  - kind: attribute
    subject:
      type: Policy
      name: Sick leave and doctor's notes
    attribute: summary
    value: An employee unable to work due to illness or accident must inform their direct manager before
      10:00 on the first day of absence, stating the expected duration and the address where they are
      staying if different from home. For every illness absence, regardless of duration, a medical certificate
      must be submitted within 48 hours from the start of the absence. The employer may have the employee
      examined by a control doctor of its choice.
    valid_from: '2019-01-15'
    quote: For every absence due to illness, regardless of its duration, the employee must submit a medical
      certificate within 48 hours from the start of the absence.
  - kind: attribute
    subject:
      type: Policy
      name: Sick leave and doctor's notes
    attribute: steps
    value: '1. Inform your direct manager before 10:00 on the first day of absence.

      2. Communicate the expected duration of the absence and the address where you are staying if different
      from your home address.

      3. Submit a medical certificate within 48 hours from the start of the absence, regardless of its
      duration.

      4. Be available for examination by a control doctor chosen by the employer if requested.'
    valid_from: '2019-01-15'
    quote: must inform their direct manager before 10:00 on the first day of absence.
  wiki-2024-02-12-001:
  - kind: attribute
    subject:
      type: Policy
      name: Remote office equipment and hardware purchasing
    attribute: summary
    value: Everyone working from home can buy desk peripherals (monitors, keyboards, mice, headsets, webcams,
      docking stations) from any shop and expense them via Expensify, with a budget of up to €500 per
      employee per year. Purchases under €500 need no approval; above €500 the line manager must approve
      in Expensify. Laptops are not covered, as they are always provided by IT.
    valid_from: '2024-02-12'
    quote: Everyone working from home can buy desk peripherals and expense them.
  - kind: attribute
    subject:
      type: Policy
      name: Remote office equipment and hardware purchasing
    attribute: steps
    value: '1. Buy the desk peripheral (monitor, keyboard, mouse, headset, webcam or docking station)
      from any shop, e.g. Amazon, Coolblue, MediaMarkt, within your €500 yearly budget.

      2. Submit the receipt in Expensify.

      3. If the amount is above €500, ask your line manager to approve it in Expensify; under €500 no
      approval is needed.'
    valid_from: '2024-02-12'
    quote: Buy from any shop (Amazon, Coolblue, MediaMarkt...) and submit the receipt in Expensify.
  - kind: ownership
    subject:
      type: Policy
      name: Remote office equipment and hardware purchasing
    owner: laura.desmet@foo.be
    quote: Remote work equipment & peripherals
