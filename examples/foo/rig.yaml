    rationale: Newer statement from someone without authority over this topic; needs owner approval.
    question: 'person:elise-peeters-foo-be states ''steps = 1. The hiring manager sends the permit
      file by email to the Flemish department (processing takes about 4 months).

      2. Once the permit is granted, the new hire gets a visa.

      3. The new hire registers at the town hall.'' for Hiring a non-EU citizen in Belgium (single permit),
      replacing ''steps = 1. The hiring manager confirms the candidate and the gross annual salary with
      HR before making an offer.

      2. The hiring manager collects the documents from the candidate: passport copy, diploma, signed
      employment contract and a medical certificate.

      3. The hiring manager sends the application file to the Flemish Department of Work and Social Economy
      by email.

      4. Processing takes about 4 months. Plan the start date accordingly.

      5. Once approved, the candidate applies for a type D visa at the Belgian embassy in their country.

      6. After arrival, the employee registers at the Ghent municipality within 8 working days.''. Approve?'
