    - wiki-2023-03-01-001:0
    rationale: Newer statement from someone without authority over this topic; needs owner approval.
    question: person:elise-peeters-foo-be states 'summary = Foo always requires a doctor's note
      within 48 hours of the start of sick leave, even when the absence is only one day. The note must
      be uploaded in the portal.' for Sick leave and doctor's notes, replacing 'summary = A medical certificate
      is not required for an incapacity for work of only one day, up to 3 times per calendar year. The
      employee must still inform their direct manager before 10:00 and register the absence in the employee
      portal on the same day. For the fourth one-day absence in a calendar year, and for every absence
      longer than one day, a medical certificate must be submitted within 48 hours from the start of the
      absence. Foo BV does not use the exception for employers with fewer than 50 employees.'. Approve?
  meeting-2026-03-05-001:0:
    action: escalate
    target_fact_ids:
    - wiki-2024-02-12-001:0
    rationale: Newer statement from someone without authority over this topic; needs owner approval.
    question: person:tom-verbeke-foo-be states 'summary = Since 16 March 2026, direct expensing of
      external hardware is stopped. All peripherals must be ordered through the internal IT procurement
      portal using its standard catalogue. Tom Verbeke (IT Asset Manager) is the only person who can approve
      exceptions or items outside the catalogue; line managers can no longer approve hardware purchases.'
      for Remote office equipment and hardware purchasing, replacing 'summary = Everyone working from
      home can buy desk peripherals (monitors, keyboards, mice, headsets, webcams, docking stations) from
      any shop and expense them via Expensify, with a budget of up to €500 per employee per year. Purchases
      under €500 need no approval; above €500 the line manager must approve in Expensify. Laptops are
      not covered, as they are always provided by IT.'. Approve?
  meeting-2026-03-05-001:1:
    action: escalate
    target_fact_ids:
    - wiki-2024-02-12-001:1
    rationale: Newer statement from someone without authority over this topic; needs owner approval.
    question: 'A source states ''steps = 1. Do not expense hardware directly from an external vendor.

      2. Order the peripheral through the internal IT procurement portal, choosing from the standard catalogue.

      3. For exceptions or items outside the catalogue, request approval from Tom Verbeke (IT Asset Manager);
      line managers cannot approve hardware purchases.'' for Remote office equipment and hardware purchasing,
      replacing ''steps = 1. Buy the desk peripheral (monitor, keyboard, mouse, headset, webcam or docking
      station) from any shop, e.g. Amazon, Coolblue, MediaMarkt, within your €500 yearly budget.

      2. Submit the receipt in Expensify.

      3. If the amount is above €500, ask your line manager to approve it in Expensify; under €500 no
      approval is needed.''. Approve?'
