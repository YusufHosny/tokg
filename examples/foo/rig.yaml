  wiki-2023-03-01-001:
  - kind: attribute
    subject:
      type: Policy
      name: Sick leave and doctor's notes
    attribute: summary
    value: A medical certificate is not required for an incapacity for work of only one day, up to 3 times
      per calendar year. The employee must still inform their direct manager before 10:00 and register
      the absence in the employee portal on the same day. For the fourth one-day absence in a calendar
      year, and for every absence longer than one day, a medical certificate must be submitted within
      48 hours from the start of the absence. Foo BV does not use the exception for employers with
      fewer than 50 employees.
    valid_from: '2023-03-01'
    quote: A medical certificate is not required for an incapacity for work that lasts only one day, up
      to 3 times per calendar year.
    asserted_by: laura.desmet@foo.be
  - kind: attribute
    subject:
      type: Policy
      name: Sick leave and doctor's notes
    attribute: steps
    value: '1. Inform your direct manager before 10:00 on the day of absence.

      2. Register the absence in the employee portal on the same day.

      3. For the fourth one-day absence in a calendar year, or any absence longer than one day, submit
      a medical certificate within 48 hours from the start of the absence.'
    valid_from: '2023-03-01'
    quote: The employee must still inform their direct manager before 10:00 and register the absence in
      the employee portal on the same day.
    asserted_by: laura.desmet@foo.be
  - kind: ownership
    subject:
      type: Policy
      name: Sick leave and doctor's notes
    owner: marc.dubois@sdworx.com
    valid_from: '2023-03-01'
    quote: 'Questions about this article: contact Marc Dubois.'
  wiki-2023-05-10-001:
  - kind: attribute
    subject:
      type: Policy
      name: Hiring a non-EU citizen in Belgium (single permit)
    attribute: summary
    value: Non-EU/EEA candidates need a single permit (gecombineerde vergunning), one permit covering
      both the right to work and the right to stay in Belgium. The hiring manager confirms candidate and
      salary with HR, collects the documents, and submits the application file to the Flemish Department
      of Work and Social Economy; processing takes about 4 months.
    context:
      country: BE
      audience: non-EU nationals
    valid_from: '2023-05-10'
    quote: 'Non-EU employees need a single permit (gecombineerde vergunning): one permit that covers both
      the right to work and the right to stay in Belgium.'
  - kind: attribute
    subject:
      type: Policy
      name: Hiring a non-EU citizen in Belgium (single permit)
    attribute: steps
    value: '1. The hiring manager confirms the candidate and the gross annual salary with HR before making
      an offer.

      2. The hiring manager collects the documents from the candidate: passport copy, diploma, signed
      employment contract and a medical certificate.

      3. The hiring manager sends the application file to the Flemish Department of Work and Social Economy
      by email.

      4. Processing takes about 4 months. Plan the start date accordingly.

      5. Once approved, the candidate applies for a type D visa at the Belgian embassy in their country.

      6. After arrival, the employee registers at the Ghent municipality within 8 working days.'
    context:
      country: BE
      audience: non-EU nationals
    valid_from: '2023-05-10'
    quote: The hiring manager sends the application file to the Flemish Department of Work and Social
      Economy by email.
  - kind: ownership
    subject:
      type: Policy
      name: Hiring a non-EU citizen in Belgium (single permit)
    owner: sophie.claes@foo.be
    context:
      country: BE
    quote: This page explains how to hire someone who does not have EU/EEA citizenship to work at our
      Ghent office.
