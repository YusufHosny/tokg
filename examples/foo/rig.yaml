      name: Hiring a non-EU citizen in Belgium (single permit)
    attribute: steps
    value: '1. Hiring manager checks the proposed salary with Sophie Claes before making an offer (highly
      qualified worker salary thresholds are updated every January).

      2. Hiring manager collects the candidate''s documents in the shared HR folder.

      3. Sophie Claes, the registered company user for Foo, submits the single permit application
      through the online "Working in Belgium" platform.

      4. Wait for processing, which recently takes about 2.5 to 3 months.'
    context:
      country: BE
      audience: non-EU nationals
