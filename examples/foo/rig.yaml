    rationale: Newer statement from someone without authority over this topic; needs owner approval.
    question: 'A source states ''summary = Foo does not opt out of the statutory first-day exemption
      for sick leave certificates: employees may report sick for a single day without a doctor''s note,
      a maximum of 3 times per calendar year. The rule is laid down in Article 7.3 of the Work Regulations
      (amendment no. 3).'' for Sick leave and doctor''s notes, replacing ''summary = Since 28 November
      2022, employees in Belgium no longer need to submit a medical certificate for the first day of incapacity
      for work, up to 3 times per calendar year (one-day absences). Employers with fewer than 50 employees,
      such as Foo (46 employees), may keep requiring a certificate for every absence, but only if
      the work regulations explicitly state this. Foo''s Article 7.3 currently requires a certificate
      for every absence, so Foo must either adopt the exemption and update Article 7.3, or opt out
      via a formal amendment confirming the certificate requirement.''. Approve?'
