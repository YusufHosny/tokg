[project]
name = "tokg"
version = "0.1.0"
description = "TOKG (Temporal Ownership-Grounded Knowledge Graph): current, owned, sourced organisational knowledge"
readme = "README.md"
authors = [
    { name = "Yusuf Hosny", email = "yusufyy2004@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "fastmcp>=4.0.10",
    "langchain-core>=1.6.6",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
claude = [
    "langchain-cli-agents @ git+https://github.com/YusufHosny/langchain_cli_agents@c56cd7d814b308f3173ae5398ed6ebe29575cd21",
]
neo4j = [
    "neo4j>=6.3.1",
]

[project.scripts]
tokg = "tokg.cli:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
langchain-cli-agents = { git = "https://github.com/YusufHosny/langchain_cli_agents", rev = "c56cd7d814b308f3173ae5398ed6ebe29575cd21" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
