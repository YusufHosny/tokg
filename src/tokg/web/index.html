<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recall</title>
<link rel="stylesheet" href="base.css">
<style>
  body { background: var(--soft); min-height: 100vh; }
  /* framed = shown as a browser window on a dark backdrop for the video */
  body.framed { background: radial-gradient(1400px 700px at 20% 0%, #1e2a4a 0%, var(--night) 60%); width: 1920px; height: 1080px; overflow: hidden; }
  .window { background: var(--soft); display: flex; flex-direction: column; min-height: 100vh; }
  body.framed .window { position: absolute; left: 80px; top: 36px; width: 1760px; height: 858px; min-height: 0;
    border-radius: 18px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06); }
  .chrome { display: none; height: 44px; background: #e9edf3; border-bottom: 1px solid var(--line); align-items: center; gap: 8px; padding: 0 18px; }
  body.framed .chrome { display: flex; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .url { margin-left: 18px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 5px 14px; font-size: 14px; color: var(--muted); width: 420px; }
  .url b { color: var(--ink-2); font-weight: 500; }

  header { display: flex; align-items: center; gap: 22px; padding: 16px 28px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 750; font-size: 22px; letter-spacing: -.02em; }
  .search { flex: 1; max-width: 960px; display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--line); border-radius: 12px;
    padding: 11px 16px; font-size: 18px; background: #fff; }
  .search.focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .search input { border: 0; outline: 0; font: inherit; flex: 1; color: var(--ink); background: transparent; }
  .caret { display: inline-block; width: 2px; height: 22px; background: var(--accent); margin-left: 1px; vertical-align: middle; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--soft); color: var(--ink-2); white-space: nowrap; }
  .me { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; flex: none; }

  main { flex: 1; display: grid; grid-template-columns: 1.55fr 1fr; gap: 20px; padding: 18px 28px; min-height: 0; position: relative; }
  .col { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 22px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  h2 { font-size: 24px; letter-spacing: -.02em; line-height: 1.25; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 10px; }
  .b-ok { background: var(--ok-soft); color: var(--ok); } .b-acc { background: var(--accent-soft); color: var(--accent); }
  .b-warn { background: var(--warn-soft); color: var(--warn); } .b-bad { background: var(--bad-soft); color: var(--bad); }
  .lead { font-size: 15.5px; line-height: 1.5; color: var(--ink-2); }
  ol.steps { margin: 10px 0 0 0; padding-left: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 6px; }
  ol.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; font-size: 14.5px; line-height: 1.45; color: var(--ink); }
  ol.steps li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; display: grid; place-items: center; margin-top: 1px; }
  .srcline { margin-top: 10px; font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .srclink { color: var(--accent); font-weight: 600; }

  .tl { display: flex; flex-direction: column; gap: 0; }
  .tl-item { display: grid; grid-template-columns: 110px 22px 1fr; gap: 12px; padding: 6px 0; position: relative; }
  .tl-date { font-size: 13.5px; color: var(--muted); font-weight: 600; padding-top: 2px; text-align: right; }
  .tl-dot { width: 14px; height: 14px; border-radius: 50%; margin-top: 4px; justify-self: center; position: relative; z-index: 1; }
  .tl-item:not(:last-child) .tl-dot::after { content: ""; position: absolute; left: 6px; top: 16px; width: 2px; height: 52px; background: var(--line); }
  .tl-title { font-size: 15px; font-weight: 650; }
  .tl-sub { font-size: 13.5px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
  .struck .tl-title { text-decoration: line-through; text-decoration-color: var(--bad); text-decoration-thickness: 2px; color: var(--muted); }

  .owner { display: flex; gap: 16px; align-items: center; }
  .owner .avatar { width: 58px; height: 58px; font-size: 20px; }
  .owner-name { font-size: 20px; font-weight: 700; }
  .owner-role { color: var(--muted); font-size: 14.5px; margin-top: 2px; }
  .btn { margin-top: 16px; display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; font-weight: 650; font-size: 15px; padding: 10px 16px; border-radius: 10px; border: 0; cursor: pointer; }
  .case { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; margin-top: 10px; cursor: pointer; }
  .case-name { font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .case-sub { grid-column: 1 / -1; font-size: 13px; color: var(--muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .case.hl { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

  .drawer { position: absolute; top: 24px; right: 28px; bottom: 24px; width: 640px; background: #fff; border: 1px solid var(--line); border-radius: 16px;
    box-shadow: -30px 0 80px rgba(15,23,42,.18); padding: 24px 26px; overflow: hidden; display: flex; flex-direction: column; }
  .drawer .meta { font-size: 13.5px; color: var(--muted); margin: 6px 0 14px; }
  .drawer .body { font-size: 15px; line-height: 1.6; color: var(--ink-2); white-space: pre-wrap; overflow: hidden; }
  mark { background: #fde68a; color: var(--ink); padding: 1px 2px; border-radius: 3px; }
  .x { position: absolute; top: 18px; right: 20px; font-size: 22px; color: var(--muted); cursor: pointer; }

  .empty { display: grid; place-items: center; color: var(--muted); font-size: 16px; grid-column: 1 / -1; }
  .spinner { display: flex; gap: 10px; align-items: center; font-size: 16px; color: var(--muted); }
  .bar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #e2e8f0, #c7d2fe, #e2e8f0); background-size: 200% 100%; }

  #cursor { position: absolute; left: 0; top: 0; width: 26px; height: 26px; pointer-events: none; z-index: 50; display: none; }
  body.scripted #cursor { display: block; }
  .ripple { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 3px solid var(--accent); pointer-events: none; z-index: 49; opacity: 0; }
  .who { position: absolute; left: 1600px; top: 918px; display: none; }

  /* app-only: sign-in, inbox, ask-the-owner, plain answers */
  .signin { max-width: 460px; margin: 90px auto; grid-column: 1 / -1; }
  .signin input, .askform textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 15px; margin-top: 12px; }
  .signin input:focus, .askform textarea:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .hint { font-size: 13.5px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
  .hint code { font-family: "JB Mono", monospace; font-size: 12.5px; background: var(--soft); padding: 1px 5px; border-radius: 4px; }
  .inbox-btn { position: relative; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
  .inbox-btn .n { position: absolute; top: -7px; right: -7px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 12px; display: grid; place-items: center; padding: 0 5px; }
  .esc { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
  .esc-q { font-size: 15px; line-height: 1.5; margin: 6px 0 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn.ghost { background: #fff; color: var(--ink-2); border: 1.5px solid var(--line); }
  .btn.sm { margin-top: 0; padding: 7px 12px; font-size: 14px; }
  .ok-note { color: var(--ok); font-weight: 600; font-size: 14px; margin-top: 12px; }
  .err-note { color: var(--bad); font-weight: 600; font-size: 14px; margin-top: 12px; }
  .plain { white-space: pre-wrap; font-size: 14.5px; line-height: 1.55; color: var(--ink-2); }
</style>
</head>
<body>
<div class="window">
  <div class="chrome">
    <span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span>
    <span class="url"><b>recall.foo.be</b>/ask</span>
  </div>
  <header>
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="none" stroke="#4f46e5" stroke-width="3"/><path d="M15 8v7l5 3" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="6" r="4" fill="#16a34a"/></svg>
      Recall
    </div>
    <label class="search" id="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Ask anything about how Foo BV works..." autocomplete="off">
    </label>
    <span class="chip" id="ctx">country = BE</span>
    <button class="inbox-btn" id="inboxbtn" style="display:none">Inbox</button>
    <div class="me"><span id="me-name"></span><span class="avatar" id="me-av" style="background:#0ea5e9"></span></div>
  </header>
  <main id="main"><div class="empty" id="empty">Ask a question to see the current, owned answer.</div></main>
</div>
<svg id="cursor" viewBox="0 0 26 26"><path d="M3 2l18 10-8 2-3 8z" fill="#0f172a" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
<div class="ripple" id="ripple"></div>

<script>
// Recall: the web app over the TOKG HTTP API (POST /ask, GET /nodes/{id}, GET /sources/{id},
// escalations). Served by `tokg serve` at /app. ?script=1 renders deterministically for the demo
// video: window.seek(t) drives typing, reveals and the cursor.
const P = new URLSearchParams(location.search);
const HASH = new URLSearchParams(location.hash.slice(1));
const store = { get: k => { try { return sessionStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { v ? sessionStorage.setItem(k, v) : sessionStorage.removeItem(k); } catch {} } };
let TOKEN = HASH.get("token") || store.get("recall-token") || "";
if (HASH.get("token")) { store.set("recall-token", TOKEN); history.replaceState(null, "", location.pathname + location.search); }
const SCRIPTED = P.get("script") === "1";
const sameOrigin = u => { try { return new URL(u, location.href).origin === location.origin; } catch { return false; } };
const API = P.get("api") && sameOrigin(P.get("api")) ? P.get("api") : location.origin;
const COMPACT = P.get("compact") === "1";
const CASES = (() => { try { return P.get("cases") ? new RegExp(P.get("cases").slice(0, 200), "i") : null; } catch { return null; } })();
const HIST_LABEL = P.get("histlabel");
if (P.get("frame") === "1") document.body.classList.add("framed");
if (SCRIPTED) document.body.classList.add("scripted");

const QUESTIONS = {
  hiring: "How do I hire a non-EU citizen in Belgium?",
  sick: "An employee called in sick for just today. Do they need to upload a doctor's note?",
  hardware: "Can I buy a monitor on Amazon and expense up to €500?",
};
// the sick question is shortened on screen; the API gets the full answer-key wording
const API_QUESTIONS = {
  sick: "An employee called in sick for just today. Do they need to upload a doctor's note to the portal, or is an email notification enough?",
};

const api = async (path, init = {}) => {
  const r = await fetch(API + path, { ...init, headers: { "Authorization": `Bearer ${TOKEN}`, "Content-Type": "application/json", ...(init.headers || {}) } });
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return r.json();
};
const nodeCache = Object.create(null), sourceCache = Object.create(null);
const viewCache = Object.create(null);
const nview = async id => viewCache[id] ??= await api(`/nodes/${encodeURIComponent(id)}?context=country%3DBE`).catch(() => null);
const node = async id => nodeCache[id] ??= (await nview(id))?.node ?? { id, name: id };
const source = async id => sourceCache[id] ??= await api(`/sources/${encodeURIComponent(id)}`).catch(() => null);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = iso => new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
const initials = n => n.split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const COLORS = ["#6366f1", "#0ea5e9", "#10b981", "#f59e0b", "#ef4444", "#8b5cf6"];
const color = s => COLORS[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const val = f => f?.statement?.value ?? "";
const firstLine = s => s.split("\n")[0].replace(/^\d+\.\s*/, "");
const shortTitle = t => t.replace(/\s*\(AI summary\)/, "").replace(/^(Re|Fwd):\s*/i, "");

// ---------------------------------------------------------------------------------------------
// data -> model

async function load(key, text) {
  const res = await api("/ask", { method: "POST", body: JSON.stringify({ question: text, context: { country: "BE" } }) });
  const view = res.views.find(v => v.node.type === "Policy") ?? res.views[0];
  if (!view) return { key, text, res, plain: true };
  const cur = attr => view.current.find(c => c.fact.statement.kind === "attribute" && c.fact.statement.attribute === attr);
  const steps = cur("steps"), summary = cur("summary");
  const main = steps ?? summary;
  if (!main) return { key, text, res, view, plain: true, owner: view.owner };
  const mainSrc = main.sources[0];
  const history = (main.history ?? []).map(f => ({ fact: f }));
  for (const h of history) h.src = await source(h.fact.sources[0].source_id);
  const pending = [...view.pending].sort((a, b) => b.fact.valid_from.localeCompare(a.fact.valid_from)).slice(0, COMPACT ? 1 : 2);
  for (const p of pending) {
    p.src = await source(p.fact.sources[0].source_id);
    p.author = p.fact.asserted_by ? await node(p.fact.asserted_by) : { name: p.src?.author ?? "unknown" };
    const esc_ = view.escalations.find(e => e.fact_id === p.fact.id);
    p.assignee = esc_?.assignee_id ? await node(esc_.assignee_id) : view.owner;
  }
  const seen = new Set(), cases = [];
  for (const f of [...view.incoming].sort((a, b) => a.fact.valid_from.localeCompare(b.fact.valid_from))) {
    if (seen.has(f.fact.subject_id)) continue;
    seen.add(f.fact.subject_id);
    const n = await node(f.fact.subject_id);
    const ex = res.views.find(v => v.node.id === n.id) ?? await nview(n.id);
    const sum = ex?.current.find(c => c.fact.statement.attribute === "summary");
    if (CASES && !CASES.test(n.name)) continue;
    cases.push({ node: n, fact: f.fact, summary: sum ? val(sum.fact) : "", ref: (sum ?? f).fact.sources[0] });
  }
  return { key, text, res, view, steps, summary, main, mainSrc, history, pending, cases, owner: view.owner };
}

// ---------------------------------------------------------------------------------------------
// render (DOM built once; seek() only toggles visibility so frames are deterministic)

function renderPlain(m) {
  const a = m.res.answer;
  document.getElementById("main").innerHTML = `
    <div class="col"><div class="card" data-r="answer">
      <div class="eyebrow">Answer</div>
      <div class="plain">${esc(a.answer)}</div>
      ${a.caveats.length ? `<div class="badges">${a.caveats.map(c => `<span class="chip b-warn">${esc(c)}</span>`).join("")}</div>` : ""}
    </div></div>
    <div class="col">${m.owner ? ownerCard(m.owner) : ""}</div>`;
  wireAsk(m);
}

function ownerCard(owner) {
  return `<div class="card" data-r="owner" id="ownercard">
        <div class="eyebrow">Who to ask</div>
        <div class="owner"><span class="avatar" style="background:${color(owner.name)}">${esc(initials(owner.name))}</span>
          <div><div class="owner-name">${esc(owner.name)}</div><div class="owner-role">${esc(owner.properties?.role ?? "")} &middot; Owner of this policy</div></div></div>
        <button class="btn" id="askbtn">Ask ${esc(owner.name.split(" ")[0])}</button>
        <div id="askslot"></div>
      </div>`;
}

// "Ask <owner>": raises a question escalation; the owner's answer is ingested back into the graph
function wireAsk(m) {
  const btn = document.getElementById("askbtn");
  if (!btn || SCRIPTED || !m.owner) return;
  btn.onclick = () => {
    const slot = document.getElementById("askslot");
    slot.innerHTML = `<div class="askform"><textarea id="askq" rows="3" placeholder="What do you want to ask ${esc(m.owner.name.split(" ")[0])}?"></textarea>
      <div class="row" style="margin-top:10px"><button class="btn sm" id="asksend">Send question</button><button class="btn sm ghost" id="askcancel">Cancel</button></div></div>`;
    document.getElementById("askq").value = m.text && m.key === "custom" ? m.text : "";
    document.getElementById("askcancel").onclick = () => slot.innerHTML = "";
    document.getElementById("asksend").onclick = async () => {
      const q = document.getElementById("askq").value.trim();
      if (!q) return;
      try {
        await api(`/nodes/${encodeURIComponent(m.view.node.id)}/questions`, { method: "POST", body: JSON.stringify({ question: q }) });
        slot.innerHTML = `<div class="ok-note">Sent to ${esc(m.owner.name)}. Their answer will be added to Recall.</div>`;
      } catch (e) { slot.innerHTML = `<div class="err-note">Could not send: ${esc(e.message)}</div>`; }
    };
  };
}

function render(m) {
  if (m.plain) return renderPlain(m);
  const stepsHtml = m.steps ? `<ol class="steps">${val(m.steps.fact).split("\n").map(l => `<li><span>${esc(l.replace(/^\d+\.\s*/, ""))}</span></li>`).join("")}</ol>` : "";
  const lead = m.summary && !(COMPACT && m.steps) ? `<p class="lead">${esc(val(m.summary.fact))}</p>` : "";
  const owner = m.owner;
  const hist = m.history.map(h => `
    <div class="tl-item struck" data-r="history">
      <div class="tl-date">${esc(HIST_LABEL ?? fmtDate(h.fact.valid_from))}</div><div class="tl-dot" style="background:#cbd5e1"></div>
      <div><div class="tl-title">${esc(shortTitle(h.src?.title ?? h.fact.sources[0].source_id))}</div>
      <div class="tl-sub">${esc(firstLine(val(h.fact)))}</div>
      <div class="tl-sub"><span class="chip b-bad">Superseded ${fmtDate(h.fact.valid_to)}</span></div></div>
    </div>`).join("");
  const pend = m.pending.map(p => `
    <div class="tl-item" data-r="pending">
      <div class="tl-date">${fmtDate(p.fact.valid_from)}</div><div class="tl-dot" style="background:#f59e0b"></div>
      <div><div class="tl-title">${esc(p.author.name)}: ${esc(shortTitle(p.src?.title ?? ""))}</div>
      <div class="tl-sub">"${esc(firstLine(val(p.fact)).slice(0, 110))}${firstLine(val(p.fact)).length > 110 ? "..." : ""}"</div>
      <div class="tl-sub"><span class="chip b-warn">Pending: not the owner, sent to ${esc(p.assignee?.name ?? "owner")}</span></div></div>
    </div>`).join("");
  const cases = m.cases.map((c, i) => `
    <div class="case" data-case="${i}" data-r="case">
      <div class="case-name">${esc(c.node.name)}</div><span class="chip">${fmtDate(c.fact.valid_from)}</span>
      <div class="case-sub">${esc(c.summary)}</div>
    </div>`).join("");
  document.getElementById("main").innerHTML = `
    <div class="col">
      <div class="card" data-r="answer" id="answer">
        <div class="eyebrow">Policy &middot; current answer</div>
        <h2>${esc(m.view.node.name)}</h2>
        <div class="badges">
          <span class="chip b-ok">&#9679; Current</span>
          ${m.main.trust === "confirmed" ? `<span class="chip b-acc">Confirmed by owner</span>` : ""}
          <span class="chip">Since ${fmtDate(m.main.fact.valid_from)}</span>
          ${m.history.length ? `<span class="chip">Supersedes ${m.history.length} older version${m.history.length > 1 ? "s" : ""}</span>` : ""}
        </div>
        ${lead}${stepsHtml}
        <div class="srcline">Source: <span class="srclink">${esc(shortTitle(m.mainSrc.source?.title ?? m.mainSrc.ref.source_id))}</span> &middot; ${fmtDate(m.mainSrc.source?.timestamp ?? m.main.fact.valid_from)}</div>
      </div>
      <div class="card" data-r="timeline" id="timeline">
        <div class="eyebrow">How this answer changed</div>
        <div class="tl">
          <div class="tl-item" data-r="curitem">
            <div class="tl-date">${fmtDate(m.main.fact.valid_from)}</div><div class="tl-dot" style="background:#16a34a"></div>
            <div><div class="tl-title">${esc(shortTitle(m.mainSrc.source?.title ?? ""))}</div>
            <div class="tl-sub"><span class="chip b-ok">Current</span></div></div>
          </div>
          ${hist}${pend}
        </div>
      </div>
    </div>
    <div class="col">
      ${owner ? ownerCard(owner) : ""}
      ${m.cases.length ? `<div class="card" data-r="cases" id="casescard"><div class="eyebrow">Previous cases</div>${cases}</div>` : ""}
    </div>
    <div class="drawer" id="drawer" style="display:none"></div>`;
  document.querySelectorAll(".case").forEach(el => el.onclick = () => openDrawer(m.cases[+el.dataset.case]));
  wireAsk(m);
}

async function drawerHtml(c) {
  const s = await source(c.ref.source_id);
  const content = s?.content ?? "";
  const q = c.ref.quote ?? "";
  let i = q ? content.indexOf(q) : -1;
  const start = Math.max(0, i - 260);
  let text = esc(content.slice(start, start + 1100));
  if (i >= 0) text = text.replace(esc(q), () => `<mark>${esc(q)}</mark>`);
  return `<span class="x" id="dx">&times;</span><div class="eyebrow">${esc(s?.kind ?? "source")} &middot; source</div>
    <h2 style="font-size:21px">${esc(s?.title ?? c.ref.source_id)}</h2>
    <div class="meta">${esc(s?.author ?? "")} &middot; ${s ? fmtDate(s.timestamp) : ""}</div>
    <div class="body">${start > 0 ? "..." : ""}${text}...</div>`;
}
async function openDrawer(c) {
  const d = document.getElementById("drawer");
  d.innerHTML = await drawerHtml(c);
  d.style.display = "flex";
  document.getElementById("dx").onclick = () => d.style.display = "none";
}

// ---------------------------------------------------------------------------------------------
// scripted timeline

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const B = Object.assign({ typeStart: 0.4, typeEnd: 2.4, submit: 2.7, answer: 3.2, history: 5.2, pending: 6.2,
  cases: 8.4, source: 9.6, sourceClose: 12.6, owner: 13.2, end: 17 }, window.__beats || {});
if (P.get("beats")) { try { for (const [k, v] of Object.entries(JSON.parse(P.get("beats")))) if (Object.hasOwn(B, k) && typeof v === "number") B[k] = v; } catch {} }
let M = null, drawerReady = false;

function center(el) {
  const r = el.getBoundingClientRect();
  return [r.left + r.width * 0.55, r.top + r.height * 0.55];
}
function show(sel, t, at, dy = 16) {
  document.querySelectorAll(sel).forEach((el, k) => {
    const p = ease((t - at - k * 0.18) / 0.45);
    el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px)`;
  });
}
function cursorPath(t) {
  // waypoints: [time, element-or-point]
  const pts = [[0, [1250, 700]], [B.typeStart - 0.3, "#search"], [B.submit, "#search"]];
  if (M.cases.length && B.source < B.end) {
    const target = document.querySelector(`.case[data-case="${M.caseIndex}"]`);
    pts.push([B.cases, [1300, 480]], [B.source - 0.35, target], [B.sourceClose - 0.4, target]);
  } else pts.push([B.history + 0.4, "#timeline"]);
  if (M.owner) pts.push([B.owner, "#askbtn"], [B.end, "#askbtn"]);
  const at = x => typeof x === "string" ? center(document.querySelector(x)) : Array.isArray(x) ? x : center(x);
  let i = pts.findIndex(p => p[0] > t);
  if (i === -1) return at(pts[pts.length - 1][1]);
  if (i === 0) return at(pts[0][1]);
  const [t0, a] = pts[i - 1], [t1, b] = pts[i];
  const p = ease((t - t0) / Math.max(0.001, t1 - t0) * 1.4);
  const [ax, ay] = at(a), [bx, by] = at(b);
  return [ax + (bx - ax) * p, ay + (by - ay) * p];
}

window.seek = t => {
  if (!M) return;
  if (M.plain) { document.getElementById("main").style.visibility = "visible"; return; }
  const q = document.getElementById("q");
  const n = Math.round(clamp((t - B.typeStart) / (B.typeEnd - B.typeStart)) * M.text.length);
  q.value = M.text.slice(0, n);
  document.getElementById("search").classList.toggle("focus", t >= B.typeStart - 0.2);
  const answered = t >= B.answer;
  document.getElementById("main").style.visibility = answered ? "visible" : "hidden";
  show("[data-r=answer]", t, B.answer);
  show("[data-r=owner]", t, B.answer + 0.25);
  show("[data-r=timeline]", t, B.answer + 0.5);
  show("[data-r=curitem]", t, B.answer + 0.7);
  show("[data-r=history]", t, B.history);
  show("[data-r=pending]", t, B.pending);
  show("[data-r=cases]", t, B.cases - 0.6);
  show("[data-r=case]", t, B.cases - 0.4);
  // highlight + pulse
  const pulse = (el, at) => { if (!el) return; const p = clamp((t - at) / 1.2); el.style.boxShadow = p > 0 && p < 1 ? `0 0 0 ${6 * Math.sin(p * Math.PI)}px rgba(79,70,229,.25)` : ""; };
  pulse(document.getElementById("timeline"), B.history);
  pulse(document.getElementById("ownercard"), B.owner);
  document.querySelectorAll(".case").forEach((el, k) => el.classList.toggle("hl", k === M.caseIndex && t >= B.source - 0.4 && t < B.sourceClose));
  const d = document.getElementById("drawer");
  const open = t >= B.source && t < B.sourceClose && M.cases.length && drawerReady;
  d.style.display = open ? "flex" : "none";
  if (open) { const p = ease((t - B.source) / 0.45) * ease((B.sourceClose - t) / 0.35); d.style.transform = `translateX(${(1 - p) * 60}px)`; d.style.opacity = p; }
  // loading shimmer between submit and answer
  const empty = document.getElementById("loading");
  if (empty) empty.style.display = t >= B.submit && t < B.answer ? "flex" : "none";
  const [cx, cy] = cursorPath(t);
  const c = document.getElementById("cursor"); c.style.transform = `translate(${cx}px, ${cy}px)`;
  const clicks = [B.submit, B.source - 0.1, B.owner + 0.6].filter(x => x !== undefined);
  const r = document.getElementById("ripple"); const k = clicks.find(x => t >= x && t < x + 0.5);
  if (k !== undefined) { const p = (t - k) / 0.5; r.style.opacity = 1 - p; r.style.transform = `translate(${cx}px, ${cy}px) scale(${0.4 + p})`; } else r.style.opacity = 0;
};

async function ask(key, text) {
  M = await load(key, text);
  M.caseIndex = M.plain ? 0 : Math.max(0, M.cases.findIndex(c => /camila/i.test(c.node.name)));
  render(M);
  if (M.plain) return;
  const loading = document.createElement("div");
  document.getElementById("loading")?.remove();
  loading.id = "loading"; loading.className = "spinner";
  loading.style.cssText = "position:absolute;left:340px;top:150px;display:none";
  loading.innerHTML = `<span class="bar" style="width:260px"></span> Searching the graph...`;
  document.querySelector(".window").appendChild(loading);
  if (M.cases.length) { document.getElementById("drawer").innerHTML = await drawerHtml(M.cases[M.caseIndex]); drawerReady = true; }
  await document.fonts.ready;
}

function showSignin(msg) {
  document.getElementById("main").innerHTML = `<div class="card signin">
    <div class="eyebrow">Sign in</div><h2>Recall</h2>
    <p class="hint">Paste your access token. An admin mints one with <code>tokg token &lt;person-id&gt; --tokens tokens.yaml</code>.</p>
    <input id="tok" type="password" placeholder="Access token" autocomplete="off">
    <button class="btn" id="tokgo">Sign in</button>
    ${msg ? `<div class="err-note">${esc(msg)}</div>` : ""}</div>`;
  document.getElementById("tokgo").onclick = () => { TOKEN = document.getElementById("tok").value.trim(); store.set("recall-token", TOKEN); boot(); };
}

async function loadInbox() {
  const btn = document.getElementById("inboxbtn");
  const items = await api("/escalations?mine=true&status=open").catch(() => []);
  btn.style.display = "";
  btn.innerHTML = `Inbox${items.length ? `<span class="n">${items.length}</span>` : ""}`;
  btn.onclick = () => openInbox(items);
}

async function openInbox(items) {
  const d = document.getElementById("drawer") ?? Object.assign(document.createElement("div"), { id: "drawer", className: "drawer" });
  if (!d.parentElement) document.getElementById("main").appendChild(d);
  const rows = await Promise.all(items.map(async e => {
    const f = e.fact_id ? await api(`/facts/${encodeURIComponent(e.fact_id)}`).catch(() => null) : null;
    const who = e.raised_by ? (await node(e.raised_by)).name : "someone";
    const subject = (await node(e.subject_id)).name;
    const actions = e.reason === "question"
      ? `<textarea rows="2" data-ans="${esc(e.id)}" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px;font:inherit"></textarea>
         <div class="row" style="margin-top:8px"><button class="btn sm" data-answer="${esc(e.id)}">Answer</button></div>`
      : `<div class="row"><button class="btn sm" data-verdict="approve" data-id="${esc(e.id)}">Approve</button>
         <button class="btn sm ghost" data-verdict="reject" data-id="${esc(e.id)}">Reject</button></div>`;
    return `<div class="esc"><div class="row"><span class="chip ${e.reason === "question" ? "b-acc" : "b-warn"}">${esc(e.reason)}</span>
      <span class="chip">${esc(subject)}</span><span class="chip">from ${esc(who)}</span></div>
      <div class="esc-q">${esc(e.question)}</div>
      ${f?.statement?.value ? `<div class="tl-sub" style="margin-bottom:10px">"${esc(f.statement.value.slice(0, 240))}"</div>` : ""}
      ${actions}</div>`;
  }));
  d.innerHTML = `<span class="x" id="dx">&times;</span><div class="eyebrow">Your inbox</div>
    <h2 style="font-size:21px">Changes and questions waiting for you</h2>
    <div style="overflow:auto;margin-top:6px">${rows.join("") || `<p class="hint">Nothing waiting. The graph keeps itself current.</p>`}</div>`;
  d.style.display = "flex"; d.style.opacity = 1; d.style.transform = "";
  document.getElementById("dx").onclick = () => d.style.display = "none";
  d.querySelectorAll("[data-verdict]").forEach(b => b.onclick = async () => {
    await api(`/escalations/${encodeURIComponent(b.dataset.id)}/resolve`, { method: "POST", body: JSON.stringify({ verdict: b.dataset.verdict }) });
    Object.keys(viewCache).forEach(k => delete viewCache[k]);
    await loadInbox(); openInbox(await api("/escalations?mine=true&status=open"));
  });
  d.querySelectorAll("[data-answer]").forEach(b => b.onclick = async () => {
    const text = d.querySelector(`[data-ans="${CSS.escape(b.dataset.answer)}"]`).value.trim();
    if (!text) return;
    await api(`/escalations/${encodeURIComponent(b.dataset.answer)}/answer`, { method: "POST", body: JSON.stringify({ answer: text }) });
    await loadInbox(); openInbox(await api("/escalations?mine=true&status=open"));
  });
}

async function boot() {
  if (SCRIPTED) {
    document.getElementById("me-name").textContent = P.get("me") || "Pieter Janssens";
    document.getElementById("me-av").textContent = initials(P.get("me") || "Pieter Janssens");
  }
  if (!SCRIPTED) {
    const me = TOKEN ? await api("/me").catch(() => undefined) : undefined;
    if (me === undefined) return showSignin(TOKEN ? "That token was not accepted." : "");
    const name = me?.name ?? "Signed in";
    document.getElementById("me-name").textContent = name;
    Object.assign(document.getElementById("me-av"), { textContent: initials(name) }).style.background = color(name);
    document.getElementById("main").innerHTML = `<div class="empty" id="empty">Ask a question to see the current, owned answer.</div>`;
    loadInbox();
  }
  return start();
}

const key = P.get("q");
async function start() {
  if (key) {
    const text = Object.hasOwn(QUESTIONS, key) ? QUESTIONS[key] : key;
    document.getElementById("q").value = SCRIPTED ? "" : text;
    await ask(key, Object.hasOwn(API_QUESTIONS, key) ? API_QUESTIONS[key] : text);
    M.text = text;
    if (SCRIPTED) window.seek(0); else window.seek(1e9);
  }
  return true;
}
window.ready = boot();

document.getElementById("q").addEventListener("keydown", async e => {
  if (e.key !== "Enter" || !e.target.value.trim()) return;
  await ask("custom", e.target.value.trim());
  M.text = e.target.value.trim();
  window.seek(1e9);
});
</script>
